plugins {
    id "maven-publish"
    id "org.jetbrains.kotlin.jvm" version "1.7.21"
    id "org.jetbrains.kotlin.kapt" version "1.7.21"
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

allprojects {
    apply plugin: "maven-publish"
    apply plugin: "com.github.johnrengelman.shadow"
    apply plugin: "org.jetbrains.kotlin.jvm"
    apply plugin: "org.jetbrains.kotlin.kapt"

    group "gg.scala.skywars.plugin"
    version "1.0.0"

    repositories {
        mavenCentral()

        maven {
            url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"

            content {
                includeGroup "org.bukkit"
                includeGroup "org.spigotmc"
            }
        }

        maven { url = "https://oss.sonatype.org/content/repositories/snapshots" }
        maven { url = "https://oss.sonatype.org/content/repositories/central" }

        maven {
            name "Scala"
            url "${property("artifactory_contextUrl")}/gradle-release"

            credentials {
                username property("artifactory_user")
                password property("artifactory_password")
            }
        }
    }

    dependencies {
        compileOnly "org.jetbrains.kotlin:kotlin-stdlib"

        compileOnly "gg.scala.commons:bukkit:3.0.8"
        kapt "gg.scala.commons:bukkit:3.0.8"

        compileOnly "gg.scala.lemon:bukkit:1.5.1"
        compileOnly "gg.scala.cgs:common:1.1.8"
        compileOnly "gg.scala.spigot:server:1.1.0"

        compileOnly "gg.scala.store:spigot:0.1.3"
        compileOnly "gg.scala.store:shared:0.1.3"

        compileOnly "com.solexgames:Grape:1.0.0"

        compileOnly "gg.scala.cloudsync:spigot:1.0.1"
    }

    compileKotlin {
        kotlinOptions.javaParameters = true
        kotlinOptions.jvmTarget = "17"
    }

    shadowJar {
        archiveClassifier.set("")

        exclude "**/*.kotlin_metadata"
        exclude "**/*.kotlin_builtins"
        exclude "META-INF/"

        archiveFileName = "skywars-plugin-${project.name}.jar"
    }

    publishing {
        publications {
            shadow(MavenPublication) { publication ->
                project.shadow.component(publication)
            }
        }

        repositories {
            maven {
                name "Scala"
                url "${property("artifactory_contextUrl")}/gradle-release"

                credentials {
                    username property("artifactory_user")
                    password property("artifactory_password")
                }
            }
        }
    }

    tasks.build.dependsOn(
        shadowJar, publishShadowPublicationToScalaRepository
    )
}
